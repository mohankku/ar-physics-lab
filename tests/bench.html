<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Test bench · AR Physics Lab</title>
  <meta name="description" content="The AR Physics Lab running on a simulated camera, with end-to-end checks against known physics.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../styles/base.css">
  <style>
    .bench { position: fixed; right: 16px; bottom: 16px; z-index: 50; width: 360px; max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px); overflow: auto; background: var(--bg-color, #f8fafc); color: var(--text-color, #1e293b);
      border: 1px solid var(--border-color, #e2e8f0); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
      font: 13px/1.45 system-ui, sans-serif; }
    .bench-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px;
      position: sticky; top: 0; background: inherit; border-bottom: 1px solid var(--border-color, #e2e8f0); }
    .bench-fold { border: 1px solid var(--border-color, #e2e8f0); background: transparent; color: inherit; border-radius: 6px;
      width: 28px; height: 28px; font-size: 16px; cursor: pointer; }
    .bench-body { padding: 10px 12px 12px; }
    .bench-body[hidden], .bench [hidden] { display: none !important; }
    .bench-note { margin: 0 0 8px; color: var(--text-muted, #64748b); }
    .bench-preview { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--border-color, #e2e8f0); }
    .bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .bench-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--text-muted, #64748b); }
    .bench-grid input[type="number"], .bench-grid select { font: inherit; font-size: 13px; font-weight: 400; padding: 5px 7px;
      border: 1px solid var(--border-color, #e2e8f0); border-radius: 6px; background: var(--bg-color, #fff); color: var(--text-color, #111); min-width: 0; }
    .bench-grid .bench-check { flex-direction: row; align-items: center; gap: 6px; }
    .bench-error { margin: 0 0 8px; padding: 6px 8px; border-radius: 6px; background: rgba(180,35,24,.1); color: #b42318; font-weight: 600; }
    .bench-real { display: flex; align-items: center; gap: 6px; font-weight: 600; margin: 0 0 6px; }
    .bench-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .bench-btns .pub-btn { font-size: 12.5px; padding: 6px 10px; }
    .bench-box { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--code-bg, #f1f5f9);
      border: 1px solid var(--border-color, #e2e8f0); }
    .bench-box table { width: 100%; border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .bench-box td { padding: 2px 4px 2px 0; vertical-align: top; }
    .bench-box td:first-child { color: var(--text-muted, #64748b); }
    .bench-diff { color: var(--text-muted, #64748b); }
    .bench-check-result { margin-top: 6px; }
    .bench .ok { color: #0a7a4b; }
    .bench .bad { color: #b42318; }
    @media (prefers-color-scheme: dark) { .bench .ok { color: #4ade80; } .bench .bad { color: #f87171; } }
  </style>
</head>
<body>
  <div data-phys-lab><p>Loading the lab…</p></div>
  <!-- The bench must run before the loader: it replaces the camera API the lab grabs at boot. -->
  <script type="module" src="bench/bench.js"></script>
  <script src="../loader.js" defer></script>
</body>
</html>
