<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Core Tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px 16px; background: #fff; color: #111; }
    .pass { color: #0a7a4b; } .fail { color: #b42318; }
    pre { margin: 2px 0 8px 18px; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <h1>AR core tests</h1>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
  <script type="module">
    import { runAll } from "./harness.js";
    const files = ["physics", "analysis", "vision", "camera", "sim", "trigger", "replay", "framebuffer"];
    const summary = document.getElementById("summary");
    try {
      for (const f of files) await import(`./${f}.test.js`);
      const { pass, fail, results } = await runAll();
      const ul = document.getElementById("results");
      for (const r of results) {
        const li = document.createElement("li");
        li.className = r.ok ? "pass" : "fail";
        li.textContent = (r.ok ? "✓ " : "✗ ") + r.name;
        if (!r.ok) { const pre = document.createElement("pre"); pre.textContent = r.error; li.appendChild(pre); }
        ul.appendChild(li);
      }
      summary.textContent = `${pass} passed, ${fail} failed`;
      document.title = fail
        ? `FAIL ${fail}/${pass + fail}: ` + results.filter((r) => !r.ok).map((r) => r.name + " — " + r.error.split("\n")[0]).join(" || ")
        : `PASS ${pass}`;
    } catch (e) {
      summary.textContent = "Test files failed to load: " + e;
      document.title = "ERROR " + e;
    }
  </script>
</body>
</html>
