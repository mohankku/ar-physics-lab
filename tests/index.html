<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Core Tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px 16px; background: #fff; color: #111; }
    .pass { color: #0a7a4b; } .fail { color: #b42318; }
    pre { margin: 2px 0 8px 18px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>core/ar-core.js tests</h1>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
  <script>
    /* Minimal test runner with the same call shape as node:test. */
    window.miniTest = (function() {
      var pass = 0, fail = 0;
      function run(name, fn) {
        var li = document.createElement("li");
        try { fn(); pass++; li.className = "pass"; li.textContent = "✓ " + name; }
        catch (e) {
          fail++; li.className = "fail"; li.textContent = "✗ " + name;
          var pre = document.createElement("pre"); pre.textContent = e.message; li.appendChild(pre);
        }
        document.getElementById("results").appendChild(li);
        document.getElementById("summary").textContent = pass + " passed, " + fail + " failed";
        document.body.setAttribute("data-result", fail ? "fail" : "pass");
      }
      return run;
    })();
  </script>
  <script src="../core/ar-core.js"></script>
  <script src="ar-core.test.js"></script>
</body>
</html>
